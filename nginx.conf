server {
  listen 80;
  root /usr/share/nginx/html;
  # Relative redirects (/page -> /page/): correct behind a reverse proxy and on any port.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Hashed build files never change: cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The page itself must always be fresh (it points to the current hashed files).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
