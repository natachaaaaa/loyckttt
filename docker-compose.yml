# Site:            docker compose up -d --build        -> http://localhost:8088 (WEB_PORT in .env)
# Dev (hot reload): docker compose --profile dev up dev -> https://localhost:5173 (usable in Storyblok's editor)
# Storyblok setup: docker compose run --rm storyblok-setup [--reset]
# Settings come from .env (copy .env.example).

services:
  web:
    build:
      context: .
      args:
        VITE_STORYBLOK_TOKEN: ${VITE_STORYBLOK_TOKEN:-}
        VITE_STORYBLOK_REGION: ${VITE_STORYBLOK_REGION:-eu}
        VITE_GCAL_ID: ${VITE_GCAL_ID:-}
        VITE_GCAL_KEY: ${VITE_GCAL_KEY:-}
        VITE_WEB3FORMS_KEY: ${VITE_WEB3FORMS_KEY:-}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
    ports:
      - "${WEB_PORT:-8088}:80"
    restart: unless-stopped

  dev:
    profiles: [dev]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev:editor -- --host 0.0.0.0"
    env_file:
      - path: .env
        required: false
    environment:
      WATCH_POLLING: "1" # host edits aren't signalled through the mount (see vite.config.js)
    volumes:
      - .:/app
      - /app/node_modules # the container's own deps, not the host's
    ports:
      - "${DEV_PORT:-5173}:5173"

  # One-shot: creates the blok types, uploads the photos and fills the home page in the Storyblok space.
  storyblok-setup:
    profiles: [setup]
    image: node:22-alpine
    working_dir: /app
    entrypoint: ["node", "scripts/storyblok-setup.mjs"]
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app:ro
